spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Uses H2 in-memory for zero-setup instant local running & testing
    url: jdbc:h2:mem:shadisetu_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
